spring:
  data:
    redis:
      host: ${MEETFLOW_REDIS_HOST:127.0.0.1}
      port: ${MEETFLOW_REDIS_PORT:6379}
      password: ${MEETFLOW_REDIS_PASSWORD:}
      timeout: ${MEETFLOW_REDIS_TIMEOUT:2s}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  application:
    name: futuremade
  ai:
    deepseek:
      api-key: ${SPRING_AI_DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-chat
          max-tokens: 16384
  config:
    import: file:./config/futuremade-datasource.properties

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

meetflow:
  knowledge-cache:
    enabled: ${MEETFLOW_KNOWLEDGE_CACHE_ENABLED:true}
    ttl: ${MEETFLOW_KNOWLEDGE_CACHE_TTL:24h}
  knowledge:
    max-meetings: ${MEETFLOW_KNOWLEDGE_MAX_MEETINGS:5}
    max-source-chars: ${MEETFLOW_KNOWLEDGE_MAX_SOURCE_CHARS:18000}
    milvus:
      # 仅在需要连接 Zilliz Cloud 时启用；Endpoint 使用 HTTPS 完整地址。
      enabled: ${MEETFLOW_MILVUS_ENABLED:false}
      endpoint: ${ZILLIZ_ENDPOINT:}
      token: ${ZILLIZ_TOKEN:}
      # 连接及单次只读请求超时，单位为秒。
      timeout-seconds: ${ZILLIZ_TIMEOUT_SECONDS:30}
  ai:
    # 已注册的 Spring ChatModel Bean 名称。
    default-model: ${MEETFLOW_AI_DEFAULT_MODEL:deepSeekChatModel}
    # 分批预算按 UTF-8 字节估算，并非模型 Token 上限。
    topic-batch-max-bytes: ${MEETFLOW_TOPIC_BATCH_MAX_BYTES:24000}
    topic-max-calls: ${MEETFLOW_TOPIC_MAX_CALLS:80}
    # 跨批归并时样例最大字符数和最大轮数。
    topic-cross-sample-chars: ${MEETFLOW_TOPIC_CROSS_SAMPLE_CHARS:120}
    topic-cross-merge-rounds: ${MEETFLOW_TOPIC_CROSS_MERGE_ROUNDS:4}
    # 豆包通过方舟兼容接口单独注册；未配置时不影响现有模型。
    doubao:
      enabled: ${MEETFLOW_DOUBAO_ENABLED:false}
      base-url: ${VOLC_ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      api-key: ${VOLC_ARK_API_KEY:}
      model: ${VOLC_ARK_MODEL:}
      embedding:
        # 多模态向量接口独立启用，与聊天模型共用方舟地址和 API Key。
        enabled: ${MEETFLOW_DOUBAO_EMBEDDING_ENABLED:false}
        model: ${VOLC_ARK_EMBEDDING_MODEL:}
    platforms:
      deepseek: deepSeekChatModel
      doubao: doubaoChatModel
  evaluation:
    # 评审调用使用指定的模型 Bean。
    judge-model: doubaoChatModel
  minutes:
    background:
      # 执行建表脚本后显式启用后台任务。
      enabled: ${MEETFLOW_MINUTES_BACKGROUND_ENABLED:false}
      poll-delay-ms: 5000
    task-lease-seconds: 120
  transcript-context:
    # 工具调用次数仅作为日志提醒；原文单次返回仍限制条数和长度。
    max-calls: 3
    max-utterances: 10
    max-chars: 3000
  transcript-chunk:
    # 正文按 Java UTF-16 单元计数；不包含提示词和上文。
    target-chars: 6000
    max-chars: 8000
    # 从上一分段末尾取完整发言作为上文，超过预算时停止。
    context-utterances: 5
    context-chars: 500
  tos:
    endpoint: ${VOLC_TOS_ENDPOINT:}
    region: ${VOLC_TOS_REGION:}
    bucket: ${VOLC_TOS_BUCKET:}
    access-key: ${VOLC_TOS_ACCESS_KEY:}
    secret-key: ${VOLC_TOS_SECRET_KEY:}
    signed-url-seconds: ${VOLC_TOS_SIGNED_URL_SECONDS:14400}
  speech:
    api-key: ${VOLC_SPEECH_API_KEY:}
    resource-id: ${VOLC_SPEECH_RESOURCE_ID:volc.bigasr.auc}
    # 调用方标识，并非会议发言人的姓名或编号。
    uid: ${VOLC_SPEECH_UID:meetflow}
    # 说话人分离模型版本；变更前确认火山服务和资源支持。
    speaker-version: ${VOLC_SPEECH_SPEAKER_VERSION:300}
  jwt:
    secret-base64: ${MEETFLOW_JWT_SECRET_BASE64:}


logging:
  level:
    root: ${MEETFLOW_LOG_LEVEL:INFO}
    com.ylz.futuremade: ${MEETFLOW_APP_LOG_LEVEL:INFO}
    com.ylz.futuremade.assistant.mapper: ${MEETFLOW_MYBATIS_LOG_LEVEL:DEBUG}
    com.ylz.futuremade.evaluation.mapper: ${MEETFLOW_MYBATIS_LOG_LEVEL:DEBUG}
    com.ylz.futuremade.identity.mapper: ${MEETFLOW_MYBATIS_LOG_LEVEL:DEBUG}
    com.ylz.futuremade.meeting.mapper: ${MEETFLOW_MYBATIS_LOG_LEVEL:DEBUG}
    com.ylz.futuremade.prompt.mapper: ${MEETFLOW_MYBATIS_LOG_LEVEL:DEBUG}
    # 调用快照保存完整会议正文及工具返回，避免 MyBatis 在控制台打印参数。
    com.ylz.futuremade.prompt.mapper.PromptMapper.insertContent: INFO
    com.ylz.futuremade.prompt.mapper.PromptMapper.updateOutput: INFO
    com.ylz.futuremade.prompt.mapper.PromptMapper.updateToolTrace: INFO
    com.ylz.futuremade.prompt.mapper.PromptMapper.content: INFO
    # 评测快照含会议问题、来源及回答，避免打印 SQL 参数和结果。
    com.ylz.futuremade.evaluation.mapper.KnowledgeEvaluationRunMapper.insert: INFO
    com.ylz.futuremade.evaluation.mapper.KnowledgeEvaluationRunMapper.saveResult: INFO
    com.ylz.futuremade.evaluation.mapper.KnowledgeEvaluationRunMapper.finish: INFO
    com.ylz.futuremade.evaluation.mapper.KnowledgeEvaluationRunMapper.find: INFO
    com.ylz.futuremade.evaluation.mapper.KnowledgeEvaluationRunMapper.review: INFO
